name: NodeSeek 签到

on:
  schedule:
    - cron: '00 16 * * *' # 北京时间每天 00:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 检查 Cookie 配置
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
        run: |
          python -c "import os, sys; sys.exit(0 if os.environ.get('NS_COOKIE') else '请先设置 NS_COOKIE Secret')"
      - name: 执行签到
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_RANDOM: 'true'
          PYTHONUTF8: '1'
        run: python -u nodeseek_sign.py
