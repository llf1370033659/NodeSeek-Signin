name: NodeSeek 签到（手动）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 执行 Cookie 签到
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_RANDOM: 'true'
          PYTHONUTF8: '1'
        run: python -u nodeseek_sign.py
